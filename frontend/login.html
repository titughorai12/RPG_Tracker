<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RPG Tracker | Enter the Realm</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- =========================
         ANIMATED BACKGROUND
    ========================== -->

    <div class="background">

        <div class="stars stars-1"></div>
        <div class="stars stars-2"></div>
        <div class="stars stars-3"></div>

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>

    </div>


    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="auth-header">

        <a href="index.html" class="back-link">
            ⚔ RPG TRACKER
            <span>← Back</span>
        </a>

    </header>


    <!-- =========================
         LOGIN AREA
    ========================== -->

    <main class="auth-container">

        <!-- Floating particles -->

        <span class="auth-particle particle-a">✦</span>
        <span class="auth-particle particle-b">✧</span>
        <span class="auth-particle particle-c">◆</span>
        <span class="auth-particle particle-d">•</span>


        <!-- Login Card -->

        <section class="auth-card">

            <!-- Sword -->

            <div class="auth-icon">

                <div class="mini-glow"></div>

                <div class="mini-sword">
                    ⚔
                </div>

            </div>


            <!-- Heading -->

            <div class="auth-heading">

                <div class="welcome-text">
                    WELCOME BACK, ADVENTURER
                </div>

                <h1>
                    Enter the Realm
                </h1>

                <p>
                    Your journey continues where you left off.
                </p>

            </div>


            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form id="loginForm">


                <!-- Username -->

                <div class="input-group">

                    <label for="loginUsername">
                        Character Name or Email
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="loginUsername"
                            name="username"
                            placeholder="Enter your character name"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="loginPassword">
                        Secret Code
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔐
                        </span>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your secret code"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <!-- Message -->

                <div
                    id="loginMessage"
                    class="auth-message">
                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    id="loginButton"
                    class="auth-submit">

                    <span class="submit-sword">
                        ⚔
                    </span>

                    <span>
                        Enter the Realm
                    </span>

                    <span class="submit-arrow">
                        →
                    </span>

                </button>

            </form>


            <!-- Register -->

            <div class="auth-switch">

                New adventurer?

                <a href="register.html">
                    Create Character
                </a>

            </div>


            <!-- Security -->

            <div class="security-note">

                <span>
                    🛡
                </span>

                <span>
                    Your adventure data is securely stored.
                </span>

            </div>

        </section>

    </main>


    <!-- IMPORTANT
         Keep your existing JavaScript
    -->

    <script src="script.js"></script>

</body>
</html>
