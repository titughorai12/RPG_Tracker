<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RPG Tracker — Create Character</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="stars"></div>
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
    </div>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-icon">⚔</div>

            <p class="eyebrow">BEGIN YOUR ADVENTURE</p>

            <h1>Create Your <span>Character</span></h1>

            <p class="auth-subtitle">
                Every legend starts with a single step.
            </p>

            <form id="registerForm">

                <div class="input-group">
                    <label for="username">Character Name</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Secret Code</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div id="registerMessage" class="message"></div>

                <button type="submit" class="auth-btn">
                    <span>⚔</span>
                    Create Character
                </button>

            </form>

            <p class="switch-page">
                Already have a character?
                <a href="login.html">Enter the Realm</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to beginning
            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
